[package]
name = "lx-music-tauri"
version = "0.0.0"
description = "LX Music (Tauri shell)"
authors = ["lx-music"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = [ "clipboard-read-text", "clipboard-write-text", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]

